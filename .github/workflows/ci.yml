name: ZeroChart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    env:
      # Dummy placeholders: src/lib/supabaseClient.ts throws at import time if
      # these are missing, which would fail the build and test steps before they
      # even start. CI never talks to a live Supabase project, so no real
      # credentials are needed (or should be committed).
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
