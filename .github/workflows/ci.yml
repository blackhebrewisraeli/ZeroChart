name: ZeroChart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    env:
      # Dummy placeholders: src/lib/supabaseClient.ts throws at import time if
      # these are missing, which would fail the build and test steps before they
      # even start. CI never talks to a live Supabase project, so no real
      # credentials are needed (or should be committed).
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      # A flag, not the token, so npm scripts never see the secret.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets SonarQube Cloud tell new code from old.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      # Skipped until the SONAR_TOKEN secret exists; Automatic Analysis in
      # SonarQube Cloud must be off by then (sonar-project.properties).
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        # Pinned to a commit: this third-party action receives SONAR_TOKEN.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  migrations:
    name: Migrations build a fresh database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      # Starts an empty local Postgres and applies supabase/migrations in order,
      # so a migration that depends on schema made outside that folder fails here.
      - name: Apply every migration
        run: supabase db start
