name: ZeroChart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    env:
      # Dummy placeholders: src/lib/supabaseClient.ts throws at import time if
      # these are missing, which would fail the build and test steps before they
      # even start. CI never talks to a live Supabase project, so no real
      # credentials are needed (or should be committed).
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      # A flag, not the token, so npm scripts never see the secret.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets SonarQube Cloud tell new code from old.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No dependency needs an install script (none in package-lock.json), so
      # refuse them all rather than run whatever a compromised package ships.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Python generators are the independent references behind the committed
      # Pine-parity and quant fixtures. Rerunning them proves the fixtures are still
      # theirs, and their coverage feeds SonarQube Cloud. After Test, which clears coverage/.
      # Wheels only, like npm's --ignore-scripts above: no package build script runs.
      - name: Reproduce Python fixtures
        run: |
          python -m pip install --disable-pip-version-check --only-binary :all: coverage==7.6.1
          python -m coverage run --branch -p scripts/generate-quant-reference-fixtures.py
          python -m coverage run --branch -p scripts/generate-pine-parity-fixtures.py
          python -m coverage combine
          python -m coverage xml -o coverage/python.xml
          git diff --exit-code -- docs/pine-parity-fixtures.json docs/quant-reference-fixtures.json

      # Skipped where SONAR_TOKEN is unavailable (pull requests from forks).
      # Automatic Analysis in SonarQube Cloud must stay off (sonar-project.properties).
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        # Pinned to a commit: this third-party action receives SONAR_TOKEN.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  migrations:
    name: Database migrations and SQL tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The upgrade check rebuilds the base commit's schema from its migrations.
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      # Starts an empty local Postgres and applies supabase/migrations in order,
      # so a migration that depends on schema made outside that folder fails here.
      - name: Apply every migration to a fresh database
        run: supabase db start

      - name: SQL tests (pgTAP)
        run: supabase test db

      - name: Concurrent sessions
        run: supabase/tests/concurrency.sh

      # Production already holds the pre-signal-classification schema and real
      # rows, so rebuild the base commit's actual migration files before
      # applying this branch's migrations, not only from scratch.
      - name: Upgrade from the pre-#79 database
        run: |
          PRE_SIGNAL_BASE="$(git log --format=%H --reverse --all -- supabase/migrations/20261024040000_signal_classification.sql | head -1)^"
          supabase/tests/upgrade.sh "$PRE_SIGNAL_BASE"

      - name: SQL tests on the upgraded database
        run: supabase test db
