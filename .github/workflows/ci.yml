name: ZeroChart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    env:
      # Dummy placeholders: src/lib/supabaseClient.ts throws at import time if
      # these are missing, which would fail the build and test steps before they
      # even start. CI never talks to a live Supabase project, so no real
      # credentials are needed (or should be committed).
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      # A flag, not the token, so npm scripts never see the secret.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets SonarQube Cloud tell new code from old.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      # Skipped until the SONAR_TOKEN secret exists; Automatic Analysis in
      # SonarQube Cloud must be off by then (sonar-project.properties).
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
