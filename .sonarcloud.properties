# Read by SonarQube Cloud's Automatic Analysis, which ignores
# sonar-project.properties and reads this file from main only. It is what
# applies while CI's scan step is skipped (no SONAR_TOKEN secret yet), so keep
# its scope in step with sonar-project.properties.
# Generated code (TanStack Router's route tree, Supabase's schema types) is
# never edited by hand to satisfy a rule. Applied migrations are append-only
# history: their repeated literals (plsql:S1192) can't be refactored after they
# have run, and this file has no per-rule ignore, so they are left out whole
# here; pgTAP in CI still covers them. sonar-project.properties scopes that to
# the one rule once the CI scan runs.
sonar.exclusions=src/test/**,supabase/tests/**,coverage/**,dist/**,.output/**,**/node_modules/**,src/routeTree.gen.ts,src/integrations/supabase/types.ts,supabase/migrations/**
sonar.issue.ignore.multicriteria=evaluationStorePathValidation
sonar.issue.ignore.multicriteria.evaluationStorePathValidation.ruleKey=typescript:S2083
sonar.issue.ignore.multicriteria.evaluationStorePathValidation.resourceKey=scripts/evaluationStore.ts
