# Analysis runs from CI (.github/workflows/ci.yml) so it can read test coverage;
# SonarQube Cloud's Automatic Analysis must stay off for this file to apply.
sonar.organization=blackhebrewisraeli
sonar.projectKey=blackhebrewisraeli_ZeroChart

sonar.sources=.
# The CLI suites sit next to their modules in scripts/, so only *.test.ts there
# is test code; it is excluded from the sources below so no file is indexed twice.
sonar.tests=src/test,scripts
sonar.test.inclusions=src/test/**,scripts/**/*.test.ts
# supabase/tests holds the pgTAP and shell test suites: test code, like src/test.
# Generated code (TanStack Router's route tree, Supabase's schema types) is
# never edited by hand to satisfy a rule.
sonar.exclusions=src/test/**,scripts/**/*.test.ts,supabase/tests/**,coverage/**,dist/**,.output/**,**/node_modules/**,src/routeTree.gen.ts,src/integrations/supabase/types.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# A migration that changes a function has to restate its whole body
# (create or replace), so every revision of check_paper_transaction reads as a
# copy of the last. Migrations are append-only history, never edited, so
# copy-paste detection there only fails the duplication gate.
sonar.cpd.exclusions=supabase/migrations/**

# For the same reason, a repeated literal in an applied migration (a role name,
# an error code) can't be refactored into a constant after it has run.
sonar.issue.ignore.multicriteria=appliedMigrationLiterals,evaluationStorePathValidation
sonar.issue.ignore.multicriteria.appliedMigrationLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.appliedMigrationLiterals.resourceKey=supabase/migrations/**
sonar.issue.ignore.multicriteria.evaluationStorePathValidation.ruleKey=typescript:S2083
sonar.issue.ignore.multicriteria.evaluationStorePathValidation.resourceKey=scripts/evaluationStore.ts
